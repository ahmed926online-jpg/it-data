<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IT DATA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap">
<style>
:root{--bg:#eef1f6;--ink:#14213d;--mut:#5d6b85;--card:#fff;--line:#d5dbe7;--soft:#e4e9f2}
@media (prefers-color-scheme:dark){:root{--bg:#0f1626;--ink:#e8edf8;--mut:#93a0ba;--card:#18223a;--line:#27334f;--soft:#202c47}}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 16px/1.7 "Readex Pro",Tahoma,"Segoe UI",sans-serif}
.w{max-width:960px;margin:0 auto;padding:28px 16px 56px}
h1{font-size:clamp(34px,8vw,56px);line-height:1.1;margin:8px 0 6px;font-weight:700;letter-spacing:-.5px;direction:ltr;text-align:right}
.sub{color:var(--mut);margin:0 0 24px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tile{border:0;border-radius:14px;padding:14px 14px 12px;color:#fff;text-align:right;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:2px;min-height:96px;justify-content:space-between}
.tile b{font-size:15px;font-weight:600;line-height:1.3;direction:ltr;text-align:right}
.tile span{font-size:13px;opacity:.9}
.tile.dim{opacity:.38}
.tile.on{outline:3px solid var(--ink);outline-offset:3px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 8px;align-items:center}
.tools input{flex:1 1 220px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:focus-visible{outline:3px solid #4c6ef5;outline-offset:2px}
.wk{margin:28px 0 8px;font-size:18px;font-weight:600;display:flex;align-items:center;gap:10px}
.wk:after{content:"";flex:1;height:1px;background:var(--line)}
.f{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;border-inline-start:6px solid var(--c)}
.f .n{flex:1;min-width:0}
.f .n div{font-weight:600}
.f .n small{color:var(--mut);font-size:13px;direction:ltr;unicode-bidi:plaintext}
.t{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--soft);white-space:nowrap}
.go{padding:7px 16px;border-radius:9px;background:var(--ink);color:var(--bg);text-decoration:none;font-size:14px;white-space:nowrap}
.go.off{background:var(--soft);color:var(--mut)}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);text-align:center;color:var(--mut);font-size:14px}
.empty{text-align:center;color:var(--mut);padding:40px 0}
</style>
</head>
<body>
<div class="w" id="app"><p class="empty">جاري التحميل...</p></div>
<script>
const TYPES=['محاضرة','سكشن','تلخيص','كتاب','امتحان سابق'];
const PAL=['#3b5bdb','#c2255c','#2b8a3e','#d9480f','#7048e8','#0b7285','#a61e4d','#e67700'];
let files=[],subjects=[],sub=null,typ=null,q='';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const col=n=>PAL[subjects.indexOf(n)%PAL.length];
const safe=u=>/^https?:\/\//i.test(u||'')?u:'';
function parse(t){
  t=t.replace(/^\uFEFF/,'');
  const d=t.split('\n')[0].includes('\t')?'\t':',';
  const rows=[];let r=[],c='',qt=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(qt){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else qt=false}else c+=ch}
    else if(ch=='"')qt=true;
    else if(ch==d){r.push(c);c=''}
    else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';rows.push(r);r=[]}
    else c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}
  return rows.filter(x=>x.some(v=>v.trim()));
}
function render(){
  const cnt=n=>files.filter(f=>f.s===n).length;
  const list=files.filter(f=>(!sub||f.s===sub)&&(!typ||f.t===typ)&&(!q||(f.n+f.s).toLowerCase().includes(q.toLowerCase())));
  const weeks=[...new Set(list.map(f=>f.w))].sort((a,b)=>a-b);
  $('#app').innerHTML=
   `<h1>IT DATA</h1><p class="sub">كل المحاضرات والسكاشن والملخصات في مكان واحد. اختار المادة وهتلاقي ملفاتها مترتبة بالأسبوع.</p>
   <div class="tiles">${subjects.map(s=>`<button class="tile${sub&&sub!==s?' dim':''}${sub===s?' on':''}" style="background:${col(s)}" data-s="${esc(s)}"><b>${esc(s)}</b><span>${cnt(s)} ملف</span></button>`).join('')}</div>
   <div class="tools"><input type="search" id="q" placeholder="ابحث باسم الملف أو المادة" value="${esc(q)}" aria-label="بحث">
   <div class="chips"><button class="chip${typ?'':' on'}" data-t="">الكل</button>${TYPES.map(t=>`<button class="chip${typ===t?' on':''}" data-t="${t}">${t}</button>`).join('')}</div></div>
   ${weeks.length?weeks.map(w=>`<div class="wk">${w?'الأسبوع '+esc(w):'ملفات عامة'}</div>`+list.filter(f=>f.w===w).map(f=>{const u=safe(f.u);return `<div class="f" style="--c:${col(f.s)}"><div class="n"><div>${esc(f.n)}</div><small>${esc(f.s)}</small></div><span class="t">${esc(f.t)}</span>${u?`<a class="go" href="${esc(u)}" target="_blank" rel="noopener">فتح</a>`:`<span class="go off">قريباً</span>`}</div>`}).join('')).join(''):'<div class="empty">مفيش ملفات بالفلتر ده. جرّب تغيّر المادة أو النوع.</div>'}<footer>اتصنع بواسطة IT hub Egy Community</footer>`;
  document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{sub=sub===b.dataset.s?null:b.dataset.s;render()});
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{typ=b.dataset.t||null;render()});
  const qi=$('#q');qi.oninput=()=>{q=qi.value;const p=qi.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
}
fetch('data.csv',{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>{
  const rows=parse(t);
  if(rows.length&&/المادة|subject/i.test(rows[0][0]))rows.shift();
  files=rows.map(x=>({s:(x[0]||'').trim(),t:(x[1]||'').trim(),w:parseInt(x[2])||0,n:(x[3]||'').trim(),u:(x[4]||'').trim()})).filter(f=>f.s&&f.n);
  subjects=[...new Set(files.map(f=>f.s))];
  render();
}).catch(()=>{$('#app').innerHTML='<p class="empty">مقدرناش نحمّل ملف data.csv. اتأكد إنه موجود جنب index.html، وإن الصفحة مفتوحة من لينك الموقع مش من الملف على الجهاز.</p>'});
</script>
</body>
</html>
